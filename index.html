<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif}
.toolbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid #ddd;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;color:var(--purple);font-size:18px;margin-right:4px}
input,button{font:inherit;appearance:none;-webkit-appearance:none;background:var(--ctrl-bg);color:var(--ctrl-text)}
input::placeholder{color:var(--ctrl-placeholder);opacity:1}
.search{flex:1;min-width:180px;max-width:360px;padding:8px 10px;border:1px solid var(--ctrl-border);border-radius:9px;background:var(--ctrl-bg)!important;color:var(--ctrl-text)!important}
button{border:1px solid var(--ctrl-border);background:var(--ctrl-bg)!important;color:var(--ctrl-text)!important;border-radius:9px;padding:7px 10px;cursor:pointer}
button:hover{background:#f7f7fa!important}
.mode.active,.cover.active{border-color:var(--purple);background:var(--ctrl-bg)!important;color:var(--purple)!important;font-weight:700;box-shadow:0 0 0 1px rgba(102,83,157,.08) inset}
.pagebox{width:62px;padding:7px;border:1px solid var(--ctrl-border);border-radius:8px;background:var(--ctrl-bg)!important;color:var(--ctrl-text)!important;text-align:center}
.status{font-size:12px;color:#666}
.wrap{padding:16px}
.sheet{position:relative;width:min(920px,100%);margin:auto;background:#fff;box-shadow:0 5px 26px rgba(0,0,0,.10);padding:27px 28px 20px;min-height:700px;overflow:hidden}
.sheethead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.title{font-size:28px;font-weight:900;font-style:italic;color:var(--purple)}
.meta{font-size:12px;color:#666} .meta b{color:var(--purple)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{min-height:31px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;align-items:center;font-size:13px}
.head{color:white;font-weight:700;justify-content:center} .pink{background:var(--pink)} .purple{background:var(--purple)}
.blank{background:var(--blank)} .meaning{background:#fafafa;font-size:12px;line-height:1.3}
.word{font-weight:700;cursor:pointer;position:relative;padding-left:20px}
.word::before{content:"";position:absolute;left:7px;top:50%;width:9px;height:9px;background:#e4e6eb;transform:translateY(-50%)}
.word:hover{background:#fff2f4;color:#bd4357}
body.hide-english .word-text,body.hide-chinese .meaning-text{visibility:hidden;user-select:none}
.footer{margin-top:14px;display:flex;justify-content:space-between;font-size:11px;color:#777}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;touch-action:none}
body.draw #ink,body.erase #ink{pointer-events:auto;cursor:crosshair}
body.draw .word,body.erase .word{pointer-events:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.23);z-index:200}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(430px,94vw);z-index:210;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding:22px;overflow:auto;transform:translateX(104%);transition:.18s}
.drawer.open{transform:none} .close{float:right;border:0;font-size:20px}
.dw{font-size:30px;font-weight:900;color:var(--purple);margin:18px 0 6px}
.dm{background:#f6f6fa;border-radius:10px;padding:10px 12px;line-height:1.55;font-size:14px}
.badge{display:inline-block;margin-top:14px;padding:4px 9px;border-radius:999px;background:#fff0f2;color:#b83d52;font-weight:700;font-size:12px}
.note{margin-top:10px;font-size:15px;line-height:1.7}
.rel{padding:10px 0;border-bottom:1px solid #eee} .rel b{font-size:17px} .rel span{display:block;color:#666;margin-top:4px;font-size:13px;line-height:1.4}
.hit{outline:3px solid #ffd56a;outline-offset:-3px}
@media(max-width:720px){
  .wrap{padding:5px} .sheet{padding:17px 8px;min-height:auto} .title{font-size:23px}
  .grid{grid-template-columns:1.05fr .7fr .7fr 1.55fr} .cell{font-size:11px;padding:5px 4px;min-height:28px} .meaning{font-size:10px}
}
@media print{.toolbar,.drawer,.overlay{display:none!important}body{background:#fff}.wrap{padding:0}.sheet{box-shadow:none;width:100%;padding:12mm}}
</style>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const sheet = document.getElementById("sheet");
const pno = document.getElementById("pno");
const pageInput = document.getElementById("pageInput");
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
let page = 1;
let mode = "browse";
let strokes = [];
let currentStroke = null;
let canvas = null, ctx = null, dpr = 1;

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function entryFor(word) {
  word = word.toLowerCase();
  for (const arr of Object.values(DATA.pages)) {
    const hit = arr.find(x => x.word.toLowerCase() === word);
    if (hit) return hit;
  }
  return null;
}
function inkKey() { return "cet6_ink_v2_" + page; }
function saveInk() {
  try { localStorage.setItem(inkKey(), JSON.stringify(strokes)); } catch(e) {}
}
function loadInk() {
  try { strokes = JSON.parse(localStorage.getItem(inkKey()) || "[]"); }
  catch(e) { strokes = []; }
  redraw();
}
function sizeCanvas() {
  if (!canvas) return;
  const r = sheet.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(r.width*dpr));
  canvas.height = Math.max(1, Math.round(r.height*dpr));
  canvas.style.width = r.width+"px";
  canvas.style.height = r.height+"px";
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  redraw();
}
function point(ev) {
  const r = canvas.getBoundingClientRect();
  return {x:ev.clientX-r.left, y:ev.clientY-r.top};
}
function redraw() {
  if (!ctx || !canvas) return;
  const r = sheet.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  ctx.strokeStyle = "#202124";
  ctx.lineWidth = 2.6;
  for (const s of strokes) {
    if (!s || !s.length) continue;
    ctx.beginPath();
    ctx.moveTo(s[0].x,s[0].y);
    for (let i=1;i<s.length;i++) ctx.lineTo(s[i].x,s[i].y);
    if (s.length===1) ctx.lineTo(s[0].x+.01,s[0].y+.01);
    ctx.stroke();
  }
}
function eraseAt(p) {
  const radius = 18;
  strokes = strokes.filter(s => !s.some(q => Math.hypot(q.x-p.x,q.y-p.y) < radius));
  saveInk(); redraw();
}
function pointerDown(ev) {
  if (mode === "browse") return;
  ev.preventDefault();
  canvas.setPointerCapture(ev.pointerId);
  const p = point(ev);
  if (mode === "erase") { eraseAt(p); return; }
  currentStroke = [p];
  strokes.push(currentStroke);
  redraw();
}
function pointerMove(ev) {
  if (mode === "browse" || !canvas.hasPointerCapture(ev.pointerId)) return;
  ev.preventDefault();
  const p = point(ev);
  if (mode === "erase") { eraseAt(p); return; }
  if (currentStroke) { currentStroke.push(p); redraw(); }
}
function pointerUp(ev) {
  if (mode === "browse") return;
  if (currentStroke) { currentStroke.push(point(ev)); currentStroke = null; saveInk(); redraw(); }
  try { canvas.releasePointerCapture(ev.pointerId); } catch(e) {}
}
function mountCanvas() {
  const old = document.getElementById("ink");
  if (old) old.remove();
  canvas = document.createElement("canvas");
  canvas.id = "ink";
  sheet.appendChild(canvas);
  canvas.addEventListener("pointerdown", pointerDown);
  canvas.addEventListener("pointermove", pointerMove);
  canvas.addEventListener("pointerup", pointerUp);
  canvas.addEventListener("pointercancel", pointerUp);
  sizeCanvas();
  loadInk();
}
function renderPage(n) {
  page = Math.max(1, Math.min(150, Number(n)||1));
  pno.textContent = page;
  pageInput.value = page;
  const arr = DATA.pages[String(page)] || [];
  let rows = "";
  for (const e of arr) {
    rows += `<div class="cell word" data-word="${esc(e.word.toLowerCase())}"><span class="word-text">${esc(e.word)}</span></div>
             <div class="cell blank"></div>
             <div class="cell blank"></div>
             <div class="cell meaning"><span class="meaning-text">${esc(e.meaning)}</span></div>`;
  }
  sheet.innerHTML = `
    <div class="sheethead">
      <div><div class="title">六级词汇本</div><div class="meta">Title: <b>六级</b></div></div>
      <div class="meta">Date&nbsp;&nbsp;/&nbsp;&nbsp;/</div>
    </div>
    <div class="grid">
      <div class="cell head pink">Word</div><div class="cell head pink">Meaning</div>
      <div class="cell head purple">Word</div><div class="cell head purple">Meaning</div>
      ${rows}
    </div>
    <div class="footer"><span>浏览模式下点击单词查看辨析；手写/橡皮模式可直接在页面上操作</span><span>- ${page}</span></div>`;
  document.querySelectorAll(".word").forEach(el => el.addEventListener("click", () => openWord(el.dataset.word)));
  mountCanvas();
  window.scrollTo({top:0,behavior:"smooth"});
}
function openWord(w) {
  if (mode !== "browse") return;
  const e = entryFor(w); if (!e) return;
  const inf = DATA.info[w] || {kind:"提示",note:"暂无辨析信息。",related:[]};
  document.getElementById("dw").textContent = e.word;
  document.getElementById("dm").textContent = e.meaning;
  document.getElementById("badge").textContent = inf.kind;
  document.getElementById("note").textContent = inf.note;
  document.getElementById("related").innerHTML = inf.related.length
    ? inf.related.map(x=>`<div class="rel"><b>${esc(x.word)}</b><span>${esc(x.meaning)}</span></div>`).join("")
    : `<div class="rel"><span>暂无高价值易混词。</span></div>`;
  drawer.classList.add("open"); overlay.classList.add("show");
}
function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("show"); }
function toggleCover(language, button, label) {
  const hidden = document.body.classList.toggle("hide-" + language);
  button.classList.toggle("active", hidden);
  button.setAttribute("aria-pressed", String(hidden));
  button.textContent = (hidden ? "显示" : "遮盖") + label;
  closeDrawer();
}
function setMode(next) {
  mode = next;
  document.body.classList.toggle("draw", mode==="draw");
  document.body.classList.toggle("erase", mode==="erase");
  for (const id of ["browseBtn","penBtn","eraserBtn"]) document.getElementById(id).classList.remove("active");
  document.getElementById(mode==="browse" ? "browseBtn" : mode==="draw" ? "penBtn" : "eraserBtn").classList.add("active");
}
document.getElementById("prev").onclick = () => renderPage(page-1);
document.getElementById("next").onclick = () => renderPage(page+1);
pageInput.addEventListener("keydown", e => { if (e.key==="Enter") renderPage(pageInput.value); });
pageInput.addEventListener("change", () => renderPage(pageInput.value));
document.getElementById("browseBtn").onclick = () => setMode("browse");
document.getElementById("penBtn").onclick = () => setMode("draw");
document.getElementById("eraserBtn").onclick = () => setMode("erase");
document.getElementById("hideChineseBtn").onclick = ev => toggleCover("chinese", ev.currentTarget, "中文");
document.getElementById("hideEnglishBtn").onclick = ev => toggleCover("english", ev.currentTarget, "英文");
document.getElementById("clearBtn").onclick = () => {
  if (confirm("确定清空这一页的全部笔迹吗？")) { strokes=[]; saveInk(); redraw(); }
};
document.getElementById("close").onclick = closeDrawer;
overlay.onclick = closeDrawer;
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  let found = null;
  for (const [pn, arr] of Object.entries(DATA.pages)) {
    const hit = arr.find(x=>x.word.toLowerCase()===q) || arr.find(x=>x.word.toLowerCase().includes(q));
    if (hit) { found={pn:Number(pn), word:hit.word.toLowerCase()}; break; }
  }
  if (!found) return;
  setMode("browse");
  renderPage(found.pn);
  setTimeout(() => {
    const el = [...document.querySelectorAll(".word")].find(x=>x.dataset.word===found.word);
    if (el) { el.classList.add("hit"); el.scrollIntoView({block:"center"}); setTimeout(()=>el.classList.remove("hit"),1400); }
    if (!document.body.classList.contains("hide-chinese") && !document.body.classList.contains("hide-english")) openWord(found.word);
  }, 50);
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape") closeDrawer();
  if (mode==="browse" && !drawer.classList.contains("open") && e.key==="ArrowLeft") renderPage(page-1);
  if (mode==="browse" && !drawer.classList.contains("open") && e.key==="ArrowRight") renderPage(page+1);
});
window.addEventListener("resize", () => { clearTimeout(window.__rs); window.__rs=setTimeout(sizeCanvas,120); });
renderPage(1);
</script>
</body></html>
